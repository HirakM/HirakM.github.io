<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Everyday Digital · Hisab</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0a1026;
      --card: #121a33;
      --text: #e8eefc;
      --muted: #9aa8c7;
      --accent: #2dd4bf;
      --line: #24304f;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fc;
        --card: #ffffff;
        --text: #152038;
        --muted: #5b6b88;
        --accent: #0f766e;
        --line: #d7deec;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 2rem; letter-spacing: -0.03em; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    .pill {
      display: inline-block;
      font-size: 0.85rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="pill">Everyday Digital</div>
      <h1>Hisab</h1>
      <p>
        Hisab is a private expense and net worth ledger. Your records stay on your device.
      </p>
      <p>
        <a href="./privacy-policy.html">Privacy policy</a><br />
        <a href="https://play.google.com/store/apps/details?id=com.everydaydigital.hisab.prod">Hisab on Google Play</a>
      </p>
    </div>
  </main>
</body>
</html>
